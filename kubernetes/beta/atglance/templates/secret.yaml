apiVersion: v1
kind: Secret
metadata:
  name: atglance-secrets
  namespace: {{ .Values.namespaceName }}
type: Opaque
data:
  db-password: {{ required "secrets.dbPassword is required" .Values.secrets.dbPassword | b64enc }}
  db-root-password: {{ required "secrets.dbRootPassword is required" .Values.secrets.dbRootPassword | b64enc }}
  app-key: {{ .Values.secrets.appKey | b64enc }}
  redis-password: {{ required "secrets.redisPassword is required" .Values.secrets.redisPassword | b64enc }}
