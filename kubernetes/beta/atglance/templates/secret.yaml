apiVersion: v1
kind: Secret
metadata:
  name: atglance-secrets
  namespace: {{ .Values.namespaceName }}
type: Opaque
data:
  db-password: {{ .Values.secrets.dbPassword | b64enc }}
  db-root-password: {{ .Values.secrets.dbRootPassword | b64enc }}
  app-key: {{ .Values.secrets.appKey | b64enc }}
  redis-password: {{ .Values.secrets.redisPassword | b64enc }}
