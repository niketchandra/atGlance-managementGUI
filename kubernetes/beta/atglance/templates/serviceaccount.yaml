apiVersion: v1
kind: ServiceAccount
metadata:
  name: atglance
  namespace: {{ .Values.namespaceName }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: atglance
  namespace: {{ .Values.namespaceName }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: atglance
  namespace: {{ .Values.namespaceName }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: atglance
subjects:
  - kind: ServiceAccount
    name: atglance
    namespace: {{ .Values.namespaceName }}
