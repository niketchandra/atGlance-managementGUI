apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.gateway.name }}
  namespace: {{ .Values.namespaceName }}
spec:
  type: {{ if .Values.service.gatewayLoadBalancer }}LoadBalancer{{ else }}{{ .Values.service.type }}{{ end }}
  ports:
    - port: 8002
      targetPort: 8002
      protocol: TCP
      name: http
    - port: 8443
      targetPort: 8443
      protocol: TCP
      name: https
  selector:
    app: {{ .Values.gateway.name }}
