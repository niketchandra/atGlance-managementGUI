[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atglance-mcp"
version = "2.0.0"
description = "Read-only MCP server for the AtGlance management console"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8", "anyio>=4"]

[project.scripts]
atglance-mcp = "atglance_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/atglance_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
